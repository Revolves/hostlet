<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Field Notes · Sample</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #eee8dc;
      color: #28251f;
      font-family: Georgia, serif;
    }
    main { width: min(680px, calc(100% - 40px)); padding: 48px 0; }
    .rule { width: 60px; height: 3px; background: #b4442f; margin-bottom: 40px; }
    h1 { font-size: clamp(48px, 10vw, 84px); line-height: .95; font-weight: 500; letter-spacing: -.045em; margin: 0 0 24px; }
    p { max-width: 480px; font: 16px/1.7 "Segoe UI", sans-serif; color: #655f55; }
    .stamp { margin-top: 42px; font: 11px/1 "Segoe UI", sans-serif; letter-spacing: .12em; text-transform: uppercase; }
  </style>
</head>
<body>
  <main>
    <div class="rule"></div>
    <h1>Notes from the field.</h1>
    <p>A small static page served by Hostlet. This HTML file travels on its own, with no build step and no external dependencies.</p>
    <div class="stamp">Hostlet sample · 2026</div>
  </main>
</body>
</html>
