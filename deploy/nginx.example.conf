# Replace all example hostnames and supply matching certificates before use.
worker_processes auto;
error_log /dev/null crit;
pid /var/run/nginx.pid;
events { worker_connections 1024; }
http {
  access_log off;
  client_max_body_size 52m;
  client_body_timeout 30s;
  proxy_request_buffering off;
  proxy_connect_timeout 10s;
  proxy_send_timeout 120s;
  proxy_read_timeout 120s;

  # Plain HTTP is rejected, including ACME HTTP-01. Use DNS-01 externally.
  server { listen 80 default_server; server_name _; return 444; }

  # Unknown HTTPS hosts do not reach the application.
  server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /etc/nginx/tls/admin/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/admin/privkey.pem;
    return 444;
  }
  server {
    listen 443 ssl;
    server_name admin.example.org;
    ssl_certificate /etc/nginx/tls/admin/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/admin/privkey.pem;
    location / {
      proxy_pass http://app:3000;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_cache off;
    }
  }
  # The content certificate must cover pages.exampleusercontent.net and
  # *.apps.exampleusercontent.net (or use separate certificates/servers).
  server {
    listen 443 ssl;
    server_name pages.exampleusercontent.net *.apps.exampleusercontent.net;
    ssl_certificate /etc/nginx/tls/content/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/content/privkey.pem;
    location / {
      proxy_pass http://app:8080;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_cache off;
    }
  }
}
