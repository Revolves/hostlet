# DRAFT: replace 192.0.2.10 in both maps with the actual external IPv4.
# One IP-matching certificate: /etc/nginx/tls/fullchain.pem and privkey.pem.
worker_processes auto;
error_log /dev/null crit;
pid /var/run/nginx.pid;
events { worker_connections 1024; }
http {
  access_log off;
  client_max_body_size 52m;
  client_body_timeout 30s;
  proxy_request_buffering off;
  proxy_connect_timeout 10s;
  proxy_send_timeout 120s;
  proxy_read_timeout 120s;

  # Require the literal IP and the appropriate external port, including Host.
  map $http_host $valid_admin_host { default 0; "192.0.2.10:30006" 1; }
  map $http_host $valid_content_host { default 0; "192.0.2.10:30007" 1; }

  # Reject duplicate IP session names before extracting anything. Match even
  # malformed values and conservatively allow arbitrary prefixes before names.
  map $http_cookie $duplicate_ip_cookie {
    default 0;
    "~(?:^|;)[^;=]*(iphost-(?:member|share)-w-[a-f0-9]{32})=[^;]*(?:;[^;]*)*;[^;=]*\1=" 1;
  }
  # Select only sessions for the requested page; do not forward management
  # cookies or sessions belonging to other pages. Invalid values are dropped.
  map $uri $ip_page {
    default "";
    "~^/p/(w-[a-f0-9]{32})(?:/|$)" $1;
  }
  map "$ip_page|$http_cookie" $page_member_cookie {
    default "";
    "~^(?<member_page>w-[a-f0-9]{32})\|(?:[^;]*;)*[ \t]*iphost-member-\k<member_page>=(?<member_value>[A-Za-z0-9_-]{43})(?:;|$)" "iphost-member-$member_page=$member_value";
  }
  map "$ip_page|$http_cookie" $page_share_cookie {
    default "";
    "~^(?<share_page>w-[a-f0-9]{32})\|(?:[^;]*;)*[ \t]*iphost-share-\k<share_page>=(?<share_value>[A-Za-z0-9_-]{43})(?:;|$)" "iphost-share-$share_page=$share_value";
  }
  map "$page_member_cookie:$page_share_cookie" $page_cookies {
    ":" "";
    "~^:(.+)$" $1;
    "~^([^:]+):$" $1;
    "~^([^:]+):(.+)$" "$1; $2";
  }

  server {
    listen 30006 ssl default_server;
    server_name _;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    if ($valid_admin_host = 0) { return 444; }
    location / {
      proxy_pass http://app:3000;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Port 30006;
      proxy_set_header Forwarded "";
      proxy_cache off;
    }
  }
  server {
    listen 30007 ssl default_server;
    server_name _;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    if ($valid_content_host = 0) { return 444; }
    if ($duplicate_ip_cookie = 1) { return 400; }
    location / {
      proxy_pass http://app:8080;
      proxy_set_header Host $http_host;
      proxy_set_header Cookie $page_cookies;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Port 30007;
      proxy_set_header Forwarded "";
      proxy_cache off;
    }
  }
}
