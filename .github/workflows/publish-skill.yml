name: Publish skill

on:
  push:
    tags:
      - "hostlet-skill-v*"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build the package without publishing"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-skill-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Verify package version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          published=$(node -p "require('./skills/hostlet-publish/package.json').version")
          tagged="${GITHUB_REF_NAME#hostlet-skill-v}"
          if [ "$published" != "$tagged" ]; then
            echo "package.json version '$published' does not match tag '$tagged'" >&2
            exit 1
          fi
      - name: Dry run
        if: ${{ inputs.dry-run }}
        run: npm publish ./skills/hostlet-publish --access public --provenance --dry-run
      - name: Publish to npm
        if: ${{ !inputs.dry-run }}
        run: npm publish ./skills/hostlet-publish --access public --provenance
